name: Raccoglitore fonti Osservatorio
on:
  workflow_dispatch:
    inputs:
      source_ids:
        description: 'IDs separati da virgola; vuoto per tutte le fonti'
        required: false
        type: string
  push:
    branches: [main]
    paths: [collector.py, test_collector.py, sources.json, requirements.txt, '.github/workflows/collect-sources.yml']
  schedule:
    - cron: '45 2,6,10,14,18,22 * * *'
permissions:
  contents: write
concurrency:
  group: osservatorio-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Regression tests
        run: python -m unittest -v test_collector
      - name: Collect public metadata
        env:
          SOURCE_IDS: ${{ inputs.source_ids }}
        run: python collector.py
      - name: Publish public metadata for the private Site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update collected public news metadata [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raccolta-fonti
          path: data/
          retention-days: 30
